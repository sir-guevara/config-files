[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "None"
opacity = 0.96

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 13.5

[cursor]
style = { shape = "Block", blinking = "Off" }

[mouse]
bindings = [{ mouse = "Middle", action = "None" }]

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
cursor = "#d79921"
text = "#282828"

[colors.selection]
background = "#504945"
text = "#fbf1c7"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"

[bell]
duration = 0
