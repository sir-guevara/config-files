# Calm, inexpensive compositing for the X1 Nano integrated GPU.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

fading = true;
fade-in-step = 0.045;
fade-out-step = 0.045;
fade-delta = 6;

shadow = true;
shadow-radius = 12;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.28;
shadow-color = "#1d2021";
shadow-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

corner-radius = 4;
rounded-corners-exclude = [ "window_type = 'dock'" ];
