# Smooth X11 compositing with subtle blur and rounded window edges.
backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;

fading = true;
fade-in-step = 0.045;
fade-out-step = 0.045;
fade-delta = 6;

# Keep focused windows readable while giving the desktop subtle depth.
active-opacity = 0.98;
inactive-opacity = 0.95;
frame-opacity = 0.98;
inactive-opacity-override = false;
opacity-rule = [
  "100:class_g = 'Rofi'",
  "100:window_type = 'dock'",
  "100:window_type = 'desktop'"
];

shadow = true;
shadow-radius = 12;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.28;
shadow-color = "#1d2021";
shadow-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Low-strength blur keeps translucent windows clear and inexpensive.
blur-method = "dual_kawase";
blur-strength = 4;
blur-background = true;
blur-background-frame = true;
blur-background-exclude = [
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

corner-radius = 5;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

detect-client-opacity = true;
detect-rounded-corners = true;
