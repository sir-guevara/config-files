<touchégg>
  <settings>
    <property name="animation_delay">120</property>
    <property name="action_execute_threshold">20</property>
    <property name="color">FE8019</property>
    <property name="borderColor">FABD2F</property>
  </settings>
  <application name="All">
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>qtile cmd-obj -o screen -f next_group</command>
        <on>end</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>qtile cmd-obj -o screen -f prev_group</command>
        <on>end</on>
      </action>
    </gesture>
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>rofi -show window</command>
        <on>end</on>
      </action>
    </gesture>
  </application>
</touchégg>
