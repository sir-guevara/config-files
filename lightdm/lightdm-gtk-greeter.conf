[greeter]
# The login screen uses the same quiet Gruvbox surface as the desktop. The
# system installer can replace this solid fallback with a supplied wallpaper.
background = #1d2021
theme-name = Gruvbox-Dark-BL
icon-theme-name = Papirus-Dark
font-name = JetBrainsMono Nerd Font 11
cursor-theme-name = Adwaita
cursor-theme-size = 24

# 144 DPI is a comfortable, legible scale on the X1 Nano's 2160x1350 panel.
xft-dpi = 144
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb

# Keep the chrome useful but sparse.
indicators = ~host;~spacer;~clock;~spacer;~language;~session;~a11y;~power
clock-format = %a %d %b  %H:%M
panel-position = top
position = 50%,center 46%,center
user-background = false
hide-user-image = true
screensaver-timeout = 60
